name: Go

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.20.14", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Test
        env:
          CGO_ENABLED: "0"
          GOWORK: "off"
        run: go test ./...
      - name: Vet
        env:
          CGO_ENABLED: "0"
          GOWORK: "off"
        run: go vet ./...
      - name: Compile hardware qualification harness
        env:
          CGO_ENABLED: "0"
          GOWORK: "off"
        run: go test -tags=s7integration -run '^$' ./test/qualification

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Race detector
        env:
          GOWORK: "off"
        run: go test -race ./...
      - name: Coverage
        env:
          CGO_ENABLED: "0"
          GOWORK: "off"
        run: |
          go test -covermode=atomic -coverpkg=github.com/punk-one/gos7 -coverprofile=coverage.out ./test
          go tool cover -func=coverage.out | tail -n 1
      - name: Fuzz smoke
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOWORK: "off"
        run: |
          go test -run '^$' -fuzz '^FuzzClassicString$' -fuzztime 5s ./codec
          go test -run '^$' -fuzz '^FuzzDecodeTPKT$' -fuzztime 5s ./internal/isotcp
          go test -run '^$' -fuzz '^FuzzDecodeCOTP$' -fuzztime 5s ./internal/isotcp
          go test -run '^$' -fuzz '^FuzzDecodeReadVarResponse$' -fuzztime 5s ./internal/protocol
          go test -run '^$' -fuzz '^FuzzDecodeWriteVarResponse$' -fuzztime 5s ./internal/protocol
          go test -run '^$' -fuzz '^FuzzDecodeSetupCommunication$' -fuzztime 5s ./internal/protocol
          go test -run '^$' -fuzz '^FuzzAddressParser$' -fuzztime 5s ./test
      - name: Vulnerability scan
        env:
          GOWORK: "off"
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.20.14"
          cache: true
      - name: Compile packages
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOWORK: "off"
        run: go build ./...
